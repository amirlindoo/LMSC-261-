
<!DOCTYPE html>
<html>
<head>
    <title>House Drawing Part 2</title>
</head>
<body>

<canvas id="canvas" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const w = canvas.width;
const h = canvas.height;

// background
ctx.fillStyle = "lightblue";
ctx.fillRect(0, 0, w, h);

// function to draw a house
function drawHouse(x, y, scale) {

    const houseWidth = w * 0.2 * scale;
    const houseHeight = h * 0.2 * scale;

    // draw roof
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + houseWidth / 2, y - houseHeight / 2);
    ctx.lineTo(x + houseWidth, y);
    ctx.stroke();

    // house body
    ctx.strokeRect(x, y, houseWidth, houseHeight);

    //  door
    ctx.strokeRect(
        x + houseWidth * 0.4,
        y + houseHeight * 0.5,
        houseWidth * 0.2,
        houseHeight * 0.5
    );

    //  left window
    ctx.strokeRect(
        x + houseWidth * 0.15,
        y + houseHeight * 0.2,
        houseWidth * 0.2,
        houseHeight * 0.2
    );

    // draw right window
    ctx.strokeRect(
        x + houseWidth * 0.65,
        y + houseHeight * 0.2,
        houseWidth * 0.2,
        houseHeight * 0.2
    );
}

// loop to draw multiple houses
const numHouses = 5;

for (let i = 0; i < numHouses; i++) {

    const x = (w * (i + 0.2)) / numHouses;
    const y = h * 0.5;
    const scale = 0.5 + Math.random() * 0.4;

    drawHouse(x, y, scale);
}

</script>
</body>
</html>
