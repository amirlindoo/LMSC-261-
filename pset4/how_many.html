<!DOCTYPE html>
<html>

<head>
    <title>How Many Circles?</title>
</head>

<body>

    <canvas id="canvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const w = canvas.width;
        const h = canvas.height;

        let numCircles = prompt("How many circles?");

        const maxRadius = w * 0.45;
        const radiusIncr = maxRadius / numCircles;

        for (let i = 0; i < numCircles; i++) {

            let radius = radiusIncr * (i + 1);

            ctx.beginPath();

            ctx.arc(
                w / 2,
                h / 2,
                radius,
                0,
                Math.PI * 2,
                false
            );

            ctx.strokeStyle = "blue";
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    </script>

</body>

</html>
